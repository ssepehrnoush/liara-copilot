keyframes a13{0%,51.3831%{opacity:0}51.5031%,100%{opacity:1}}.l14{animation:a14 11.062s infinite steps(1,end)}@keyframes a14{0%,52.5583%{opacity:0}52.6783%,100%{opacity:1}}.l15{animation:a15 11.062s infinite steps(1,end)}@keyframes a15{0%,53.7335%{opacity:0}53.8535%,100%{opacity:1}}.l17{animation:a17 11.062s infinite steps(1,end)}@keyframes a17{0%,55.6138%{opacity:0}55.7338%,100%{opacity:1}}.l18{animation:a18 11.062s infinite steps(1,end)}@keyframes a18{0%,56.789%{opacity:0}56.909%,100%{opacity:1}}.l19{animation:a19 11.062s infinite steps(1,end)}@keyframes a19{0%,57.9642%{opacity:0}58.0842%,100%{opacity:1}}.l20{animation:a20 11.062s infinite steps(1,end)}@keyframes a20{0%,59.1394%{opacity:0}59.2594%,100%{opacity:1}}.l21{animation:a21 11.062s infinite steps(1,end)}@keyframes a21{0%,60.3146%{opacity:0}60.4346%,100%{opacity:1}}.l22{animation:a22 11.062s infinite steps(1,end)}@keyframes a22{0%,61.4898%{opacity:0}61.6098%,100%{opacity:1}}.l23{animation:a23 11.062s infinite steps(1,end)}@keyframes a23{0%,62.665%{opacity:0}62.785%,100%{opacity:1}}</style><rect width="783" height="606" rx="10" fill="#0d1117" stroke="#30363d"/><path d="M0 34 H783" stroke="#30363d" stroke-width="1"/><circle cx="22" cy="17" r="6" fill="#ff5f56"/><circle cx="42" cy="17" r="6" fill="#ffbd2e"/><circle cx="62" cy="17" r="6" fill="#27c93f"/><text x="391.5" y="21.76" fill="#8b949e" font-size="12.04px" text-anchor="middle">liara-copilot: HTTP 500 -&gt; diagnosis -&gt; approved fix -&gt; verified</text><clipPath id="c0"><rect class="t0" x="18" y="48.9688" width="714" height="21"/></clipPath><g class="ln l0"><text x="18" y="62.9688" fill="#7ee787">$</text><g clip-path="url(#c0)"><text x="34.8" y="62.9688" fill="#e6edf3">node scripts/e2e.js &quot;My checkout page (/checkout) returns HTTP 500. What happened?&quot;</text></g><rect class="k0" x="733.68" y="51.4888" width="7.728" height="14.84" fill="#7ee787" opacity="0"/></g><text class="ln l2" x="18" y="108.329"><tspan fill="#6e7681">[2.9s] </tspan><tspan fill="#39c5cf">▶ </tspan><tspan fill="#e6edf3">investigate_incident</tspan><tspan fill="#6e7681">  auto</tspan></text><text class="ln l3" x="18" y="131.009"><tspan fill="#6e7681">[3.0s] </tspan><tspan fill="#3fb950">✓ </tspan><tspan fill="#c9d1d9">investigate_incident</tspan></text><text class="ln l4" x="18" y="153.689"><tspan fill="#6e7681">     #1 </tspan><tspan fill="#d29922">missing_env</tspan><tspan fill="#e6edf3">  93%</tspan></text><text class="ln l5" x="18" y="176.369" fill="#f85149">     Error: PAYMENT_API_KEY is not set: cannot create payment session</text><text class="ln l6" x="765" y="199.049" fill="#c9d1d9" direction="rtl" text-anchor="start">PAYMENT_API_KEY در متغیرهای اپ روی لیارا وجود ندارد.</text><text class="ln l7" x="765" y="221.729" fill="#c9d1d9" direction="rtl" text-anchor="start">خطاها بعد از آخرین ریلیز شروع شده‌اند (کد جدید این متغیر را لازم دارد).</text><text class="ln l8" x="18" y="244.409"><tspan fill="#6e7681">[5.6s] </tspan><tspan fill="#bc8cff">◆ approval card </tspan><tspan fill="#e6edf3">set_env_vars</tspan><tspan fill="#d29922">  risk=medium</tspan></text><text class="ln l9" x="765" y="267.089" fill="#c9d1d9" direction="rtl" text-anchor="start">۱ متغیر روی ketabkadeh ثبت می‌شود؛ بقیهٔ متغیرها دست نمی‌خورند.</text><text class="ln l10" x="18" y="289.769" fill="#3fb950">   → approved by the user</text><text class="ln l11" x="18" y="312.449"><tspan fill="#6e7681">[5.6s] </tspan><tspan fill="#39c5cf">▶ </tspan><tspan fill="#e6edf3">set_env_vars</tspan><tspan fill="#6e7681">  medium</tspan></text><text class="ln l12" x="18" y="335.129" fill="#6e7681">   · container restarted</text><text class="ln l13" x="18" y="357.809"><tspan fill="#6e7681">[9.6s] </tspan><tspan fill="#3fb950">✓ </tspan><tspan fill="#c9d1d9">set_env_vars</tspan></text><text class="ln l14" x="18" y="380.489"><tspan fill="#6e7681">[12.3s] </tspan><tspan fill="#39c5cf">▶ </tspan><tspan fill="#e6edf3">verify_recovery</tspan><tspan fill="#6e7681">  auto</tspan></text><text class="ln l15" x="18" y="403.169"><tspan fill="#6e7681">[12.4s] </tspan><tspan fill="#3fb950">✓ </tspan><tspan fill="#c9d1d9">verify_recovery</tspan><tspan fill="#3fb950">  recovered: success 67% -&gt; 100%</tspan></text><text class="ln l17" x="765" y="448.529" fill="#c9d1d9" direction="rtl" text-anchor="start">علت پیدا شد: خود صفحهٔ پرداخت خراب نبود، ریشهٔ مشکل نبودن متغیر محرمانهٔ</text><text class="ln l18" x="765" y="471.209" fill="#c9d1d9" direction="rtl" text-anchor="start">PAYMENT_API_KEY در نسخهٔ جدید بود.</text><text class="ln l19" x="765" y="493.889" fill="#c9d1d9" direction="rtl" text-anchor="start">قوی‌ترین نشانه این بود که لاگ دقیقاً می‌گفت PAYMENT_API_KEY is not set و</text><text class="ln l20" x="765" y="516.569" fill="#c9d1d9" direction="rtl" text-anchor="start">این خطا از همان بعد از انتشار v۲ شروع شده بود.</text><text class="ln l21" x="765" y="539.249" fill="#c9d1d9" direction="rtl" text-anchor="start">متغیر را تنظیم کردم و برنامه یک بار از نو بالا آمد.</text><text class="ln l22" x="765" y="561.929" fill="#c9d1d9" direction="rtl" text-anchor="start">الان مشکل برطرف شده: قبل از اصلاح، /checkout خطای ۵۰۰ می‌داد؛ بعد از</text><text class="ln l23" x="765" y="584.609" fill="#c9d1d9" direction="rtl" text-anchor="start">اصلاح، همهٔ بررسی‌ها روی /checkout با کد ۲۰۰ جواب دادند.</text></svg>